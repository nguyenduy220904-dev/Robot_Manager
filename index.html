<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Manager — Quản lý Robot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root {
    --bg: #07131d;
    --bg-soft: #0f1f2d;
    --panel: rgba(16, 28, 38, 0.9);
    --panel-2: rgba(12, 23, 31, 0.96);
    --line: rgba(125, 202, 255, 0.18);
    --cyan: #72e7ff;
    --cyan-strong: #40c9ff;
    --blue: #2ea2ff;
    --success: #31d0aa;
    --warning: #ffb74d;
    --danger: #ff5d73;
    --text: #e8f6ff;
    --muted: #9bb7c9;
    --shadow: rgba(0, 0, 0, 0.35);
    --accent: #8ee7ff;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background:
      radial-gradient(circle at top left, rgba(42, 180, 255, 0.18), transparent 28%),
      radial-gradient(circle at bottom right, rgba(31, 208, 170, 0.15), transparent 22%),
      linear-gradient(140deg, var(--bg) 0%, #0c1723 100%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 28px 18px 60px;
    position: relative;
    overflow-x: hidden;
  }

  body::before, body::after {
    content: '';
    position: fixed;
    inset: auto;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.15;
    pointer-events: none;
  }

  body::before {
    background: var(--cyan-strong);
    top: -120px;
    left: -120px;
  }

  body::after {
    background: var(--success);
    right: -100px;
    bottom: -140px;
  }

  .page {
    max-width: 1180px;
    margin: 0 auto;
  }

  .cover {
    text-align: center;
    margin-bottom: 20px;
    padding: 24px 20px 22px;
    border: 1px solid var(--line);
    border-radius: 22px;
    background: linear-gradient(135deg, rgba(12, 23, 31, 0.86), rgba(8, 18, 26, 0.94));
    box-shadow: 0 20px 38px rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(16px);
    position: relative;
    overflow: hidden;
  }

  .cover::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(114, 231, 255, 0.08), transparent 40%, rgba(49, 208, 170, 0.06));
    pointer-events: none;
  }

  .eyebrow {
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-size: 10px;
    color: var(--cyan);
    font-weight: 700;
    margin-bottom: 10px;
  }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(30px, 4vw, 48px);
    margin: 0;
    letter-spacing: 0.06em;
    color: var(--text);
  }

  .subtitle {
    margin-top: 8px;
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .header-actions {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 20px;
  }

  .btn-primary, .btn-panel, .btn-submit, .btn-cancel, .btn-small {
    font-family: 'Inter', sans-serif;
    transition: all 0.2s ease;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--cyan-strong), #1674ff);
    border: none;
    color: #041018;
    padding: 12px 20px;
    border-radius: 12px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 12px 24px rgba(64, 201, 255, 0.2);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(64, 201, 255, 0.26);
  }

  .live-clock {
    text-align: center;
    margin-bottom: 24px;
  }

  .clock-time {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(22px, 2vw, 28px);
    letter-spacing: 0.18em;
    color: var(--cyan);
  }

  .clock-date {
    color: var(--muted);
    margin-top: 8px;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .summary-strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 18px;
  }

  .summary-card {
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px 16px;
    background: rgba(10, 20, 29, 0.72);
    backdrop-filter: blur(12px);
  }

  .summary-label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .summary-card strong {
    font-size: 22px;
    color: var(--text);
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 0.04em;
  }

  .robots-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 18px;
    margin-bottom: 32px;
  }

  .robot-card {
    background: linear-gradient(180deg, rgba(15, 31, 45, 0.94), rgba(11, 21, 29, 0.92));
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 6px;
    box-shadow: 0 16px 28px rgba(0, 0, 0, 0.16);
    transition: transform 0.2s ease, border-color 0.2s ease;
  }

  .robot-card:hover {
    transform: translateY(-3px);
    border-color: rgba(114, 231, 255, 0.34);
  }

  .robot-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: transparent;
    border: 0;
    text-align: left;
    color: var(--text);
    padding: 16px 14px;
    border-radius: 12px;
    cursor: pointer;
    font: inherit;
  }

  .robot-row:hover {
    background: linear-gradient(90deg, rgba(114, 231, 255, 0.05), transparent 90%);
  }

  .robot-name-text {
    font-family: 'Orbitron', sans-serif;
    font-size: 15px;
    letter-spacing: 0.05em;
    color: var(--text);
    word-break: break-word;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 7px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
    border: 1px solid transparent;
  }

  .status-badge.integrating {
    background: rgba(114, 231, 255, 0.1);
    border-color: rgba(114, 231, 255, 0.28);
    color: var(--cyan);
  }

  .status-badge.integrated {
    background: rgba(49, 208, 170, 0.12);
    border-color: rgba(49, 208, 170, 0.32);
    color: var(--success);
  }

  .status-badge.waiting-software,
  .status-badge.waiting-calib {
    background: rgba(255, 183, 77, 0.12);
    border-color: rgba(255, 183, 77, 0.3);
    color: var(--warning);
  }

  .status-badge.completed,
  .status-badge.shipped {
    background: rgba(142, 231, 255, 0.1);
    border-color: rgba(142, 231, 255, 0.24);
    color: #9fe9ff;
  }

  .status-badge.repairing {
    background: rgba(255, 183, 77, 0.13);
    border-color: rgba(255, 183, 77, 0.38);
    color: var(--warning);
  }

  .status-badge.done {
    background: rgba(49, 208, 170, 0.12);
    border-color: rgba(49, 208, 170, 0.4);
    color: var(--success);
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .empty-icon {
    font-size: 48px;
    margin-bottom: 12px;
  }

  .empty-text {
    margin-bottom: 18px;
    font-size: 18px;
    color: var(--text);
  }

  .modal {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(4, 16, 24, 0.72);
    z-index: 600;
    padding: 20px;
  }

  .modal.show { display: flex; }

  .modal-box {
    width: min(100%, 440px);
    background: linear-gradient(180deg, rgba(14, 25, 35, 0.98), rgba(8, 18, 26, 0.98));
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 22px;
    box-shadow: 0 24px 44px rgba(0, 0, 0, 0.34);
    backdrop-filter: blur(12px);
  }

  .modal-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    color: var(--text);
    font-family: 'Orbitron', sans-serif;
    font-size: 18px;
    letter-spacing: 0.05em;
  }

  .modal-close {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    width: 34px;
    height: 34px;
    border-radius: 10px;
    cursor: pointer;
  }

  .form-group { margin-bottom: 16px; }
  .form-label {
    display: block;
    margin-bottom: 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .form-input, .form-select, .form-textarea {
    width: 100%;
    border: 1px solid var(--line);
    background: rgba(8, 18, 26, 0.8);
    color: var(--text);
    border-radius: 12px;
    padding: 12px 14px;
    font: inherit;
  }

  .form-textarea {
    min-height: 118px;
    resize: vertical;
  }

  .form-input:focus, .form-select:focus, .form-textarea:focus {
    outline: 2px solid rgba(114, 231, 255, 0.4);
    border-color: var(--cyan);
  }

  .form-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }

  .btn-cancel, .btn-submit {
    flex: 1;
    padding: 12px 14px;
    border-radius: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .btn-cancel {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
  }

  .btn-submit {
    background: linear-gradient(135deg, var(--cyan-strong), var(--blue));
    border: none;
    color: #041018;
    font-weight: 800;
  }

  .btn-submit:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .detail-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: min(100%, 430px);
    height: 100vh;
    background: linear-gradient(180deg, rgba(12, 22, 31, 0.98), rgba(7, 14, 20, 0.98));
    border-left: 1px solid var(--line);
    box-shadow: -18px 0 36px rgba(0, 0, 0, 0.2);
    transform: translateX(102%);
    transition: transform 0.3s ease;
    z-index: 500;
    padding: 24px 22px 26px;
    overflow-y: auto;
    backdrop-filter: blur(12px);
  }

  .detail-panel.show {
    transform: translateX(0);
  }

  .detail-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
  }

  .detail-header h2 {
    margin: 0;
    font-family: 'Orbitron', sans-serif;
    font-size: 24px;
    letter-spacing: 0.05em;
    line-height: 1.2;
  }

  .detail-eyebrow {
    margin-bottom: 6px;
  }

  .detail-close {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    width: 36px;
    height: 36px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 18px;
  }

  .detail-status-box {
    margin-bottom: 18px;
  }

  .detail-block {
    background: linear-gradient(135deg, rgba(114, 231, 255, 0.04), rgba(49, 208, 170, 0.03));
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 14px 12px;
  }

  .section-label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .detail-notes {
    color: var(--text);
    line-height: 1.7;
    white-space: pre-wrap;
  }

  .detail-actions {
    margin-top: 18px;
    display: grid;
    gap: 10px;
  }

  .btn-panel {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .btn-panel.primary {
    background: linear-gradient(135deg, var(--cyan-strong), var(--blue));
    border: none;
    color: #041018;
  }

  .btn-panel.secondary {
    background: rgba(114, 231, 255, 0.04);
    border: 1px solid var(--line);
    color: var(--text);
  }

  .detail-edit-box {
    display: none;
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }

  .detail-edit-box.show { display: block; }

  .compact {
    margin-top: 14px;
  }

  .gate-overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(7, 19, 29, 0.88);
    z-index: 700;
    padding: 24px;
    pointer-events: all;
  }

  .gate-overlay.show { display: flex; }

  .gate-box {
    max-width: 340px;
    text-align: center;
    padding: 26px 18px;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: linear-gradient(180deg, rgba(13, 26, 35, 0.97), rgba(8, 18, 26, 0.97));
    box-shadow: 0 22px 40px rgba(0, 0, 0, 0.26);
  }

  .gate-icon {
    font-size: 42px;
    margin-bottom: 14px;
  }

  .gate-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    margin-bottom: 8px;
    letter-spacing: 0.05em;
  }

  .gate-subtitle {
    color: var(--muted);
    line-height: 1.6;
    font-size: 13px;
  }

  .gate-dots {
    display: flex;
    justify-content: center;
    gap: 7px;
    margin: 18px 0;
  }

  .gate-dots span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--cyan);
    opacity: 0.35;
    animation: pulse 1.2s infinite ease-in-out;
  }

  .gate-dots span:nth-child(2) { animation-delay: 0.2s; }
  .gate-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  .gate-admin-link {
    color: var(--cyan);
    cursor: pointer;
    font-weight: 700;
  }

  .gate-retry-btn {
    background: linear-gradient(135deg, var(--cyan-strong), var(--blue));
    color: #041018;
    border: none;
    border-radius: 12px;
    padding: 11px 18px;
    font-weight: 800;
    cursor: pointer;
  }

  .admin-fab {
    position: fixed;
    right: 18px;
    bottom: 18px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(12, 23, 31, 0.92);
    color: var(--text);
    cursor: pointer;
    z-index: 760;
    box-shadow: 0 12px 24px rgba(0, 0, 0, 0.22);
    font-size: 20px;
    backdrop-filter: blur(10px);
  }

  .admin-fab.is-admin {
    width: auto;
    border-radius: 999px;
    padding: 0 16px;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 800;
  }

  .admin-panel {
    position: fixed;
    inset: 0;
    background: rgba(4, 16, 24, 0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 650;
    padding: 20px;
  }

  .admin-panel.show { display: flex; }

  .admin-panel-box {
    background: rgba(12, 23, 31, 0.96);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px;
    width: min(100%, 420px);
    box-shadow: 0 22px 40px rgba(0,0,0,0.32);
  }

  .admin-panel-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 16px;
    letter-spacing: 0.04em;
    margin-bottom: 12px;
  }

  .admin-panel-title button {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    width: 32px;
    height: 32px;
    border-radius: 10px;
    cursor: pointer;
  }

  .empty-pending {
    color: var(--muted);
    text-align: center;
    padding: 18px 0;
  }

  .pending-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--line);
    padding: 12px 0;
  }

  .pending-info {
    color: var(--text);
    font-size: 13px;
    line-height: 1.5;
  }

  .pending-time {
    color: var(--muted);
    font-size: 11px;
  }

  .pending-actions {
    display: flex;
    gap: 6px;
  }

  .pending-actions button {
    padding: 7px 10px;
    border-radius: 10px;
    border: 1px solid var(--line);
    cursor: pointer;
    font-size: 11px;
    font-weight: 700;
  }

  .approve-btn {
    background: linear-gradient(135deg, var(--cyan-strong), var(--blue));
    border: none;
    color: #041018;
  }

  .deny-btn {
    background: transparent;
    color: var(--danger);
  }

  .pin-modal {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(4, 16, 24, 0.7);
    z-index: 680;
    padding: 20px;
  }

  .pin-modal.show { display: flex; }

  .pin-box {
    width: min(100%, 320px);
    background: rgba(12, 23, 31, 0.96);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 22px 40px rgba(0,0,0,0.3);
  }

  .pin-icon {
    font-size: 32px;
    text-align: center;
    margin-bottom: 12px;
  }

  .pin-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 18px;
    text-align: center;
    margin-bottom: 16px;
    letter-spacing: 0.05em;
  }

  .pin-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }

  .pin-confirm {
    flex: 1;
    padding: 12px 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--cyan-strong), var(--blue));
    color: #041018;
    font-weight: 800;
    cursor: pointer;
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border-top: 1px solid var(--line);
    padding-top: 20px;
    margin-top: 28px;
  }

  @media (max-width: 640px) {
    body { padding-inline: 12px; }
    .robots-grid { grid-template-columns: 1fr; }
    .detail-panel { width: 100%; }
  }
  .robot-workspace { display:none; max-width:1180px; margin:0 auto; position:relative; z-index:1; }
  .robot-workspace.show { display:block; }
  body.workspace-open .page { display:none; }
  .workspace-top { display:flex; align-items:center; gap:16px; margin-bottom:20px; }
  .workspace-back { border:1px solid var(--line); border-radius:12px; color:var(--cyan); background:rgba(10,20,29,.8); padding:11px 15px; font:inherit; font-weight:700; cursor:pointer; }
  .workspace-heading { flex:1; min-width:0; }
  .workspace-heading h2 { margin:0; font:700 clamp(22px,4vw,34px) 'Orbitron',sans-serif; overflow-wrap:anywhere; }
  .workspace-heading p { color:var(--muted); margin:7px 0; }
  .workspace-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; }
  .workspace-section { border:1px solid var(--line); border-radius:18px; padding:20px; background:var(--panel); }
  .workspace-section h3 { margin:0 0 8px; font:700 16px 'Orbitron',sans-serif; color:var(--cyan); }
  .workspace-section p { color:var(--muted); font-size:13px; line-height:1.5; margin:0 0 14px; }
  .workspace-section textarea { min-height:210px; }
  .workspace-actions { display:flex; align-items:center; gap:12px; margin-top:18px; }
  .workspace-delete { margin-right:auto; border:1px solid rgba(255,93,115,.45); border-radius:12px; padding:12px 14px; background:rgba(255,93,115,.08); color:#ff8293; font-weight:700; cursor:pointer; }
</style>
</head>
<body>

<div class="gate-overlay show" id="gateOverlay">
  <div class="gate-box">
    <div class="gate-icon" id="gateIcon">🔒</div>
    <div class="gate-title" id="gateTitle">Đang chờ duyệt truy cập</div>
    <div class="gate-subtitle" id="gateSubtitle">Yêu cầu của bạn đã được gửi. Trang sẽ tự mở ra khi được quản trị viên duyệt.</div>
    <div class="gate-dots" id="gateDots"><span></span><span></span><span></span></div>
    <button class="gate-retry-btn" id="gateRetryBtn" type="button" style="display:none;">Gửi yêu cầu lại</button>
  </div>
</div>

(function () {

    { value: 'repairing', label: '🛠️ Đang sửa chữa' },
    { value: 'done', label: '✅ Xong' }
  ];

  const statusMap = {
    integrating: { key: 'integrating', text: 'Đang tích hợp' },
    integrated: { key: 'integrated', text: 'Đã tích hợp' },
    'waiting-software': { key: 'waiting-software', text: 'Đang đợi cài software' },

    completed: { key: 'completed', text: 'Hoàn thành' },
    shipped: { key: 'shipped', text: 'Đã xuất' },
    repairing: { key: 'repairing', text: 'Đang sửa chữa' },
    done: { key: 'done', text: 'Xong' }
  };

  function buildStatusSelect(selectEl, isRepairMode) {
    const options = isRepairMode ? repairStatusOptions : standardStatusOptions;
    selectEl.innerHTML = options.map(option => `<option value="${option.value}">${option.label}</option>`).join('');
  }

  function normalizeStatus(status) {
    if (!status) return 'integrating';
    const value = String(status).trim().toLowerCase();
    if (statusMap[value]) return statusMap[value].key;
    if (value.includes('integrat')) return 'integrating';
    if (value.includes('software')) return 'waiting-software';
    if (value.includes('calib')) return 'waiting-calib';
    if (value.includes('repair') || value.includes('sửa')) return 'repairing';
    if (value.includes('xong') || value === 'done') return 'done';
    if (value.includes('complete') || value.includes('finish')) return 'completed';
    if (value.includes('ship')) return 'shipped';
    return 'integrating';
  }

  function getRepairStatusValue(status) {
    const value = String(status || '').trim().toLowerCase();
    if (value === 'done' || value.includes('xong')) return 'done';
    return 'repairing';
  }

  function getStatusMeta(status) {
    const normalized = normalizeStatus(status);
    return statusMap[normalized] || statusMap.repairing;
  }

  const clockTimeEl = document.getElementById('clockTime');
  const clockDateEl = document.getElementById('clockDate');
  const weekdays = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];

  function tickClock() {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    clockTimeEl.textContent = hh + ':' + mm + ':' + ss;

    const dd = String(now.getDate()).padStart(2, '0');
    const mo = String(now.getMonth() + 1).padStart(2, '0');
    clockDateEl.textContent = weekdays[now.getDay()] + ', ' + dd + '/' + mo + '/' + now.getFullYear();
  }

  tickClock();
  setInterval(tickClock, 1000);

  function getDeviceId() {
    let id = localStorage.getItem('deviceId');
    if (!id) {
      id = 'dev_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
      localStorage.setItem('deviceId', id);
    }
    return id;
  }

  const deviceId = getDeviceId();
  const myAccessRef = accessCollection.doc(deviceId);
  const gateOverlay = document.getElementById('gateOverlay');
  const gateIcon = document.getElementById('gateIcon');
  const gateTitle = document.getElementById('gateTitle');
  const gateSubtitle = document.getElementById('gateSubtitle');
  const gateDots = document.getElementById('gateDots');
  const gateRetryBtn = document.getElementById('gateRetryBtn');
  const adminFab = document.getElementById('adminFab');
  const adminPanel = document.getElementById('adminPanel');
  const closeAdminPanelBtn = document.getElementById('closeAdminPanel');
  const pendingListEl = document.getElementById('pendingList');

  async function ensureAccessDoc() {
    try {
      const snap = await myAccessRef.get();
      if (!snap.exists) {
        await myAccessRef.set({
          status: 'pending',
          isAdmin: false,
          requestedAt: new Date().toISOString()
        });
      }
    } catch (e) {
      console.error('Access doc error:', e);
    }
  }

  function watchAccess() {
    myAccessRef.onSnapshot((doc) => {
      const data = doc.data();
      if (!data) return;

      if (data.status === 'approved') {
        gateOverlay.classList.remove('show');
      } else if (data.status === 'denied') {
        gateOverlay.classList.add('show');
        gateIcon.textContent = '⛔';
        gateTitle.textContent = 'Truy cập bị từ chối';
        gateSubtitle.textContent = 'Quản trị viên chưa cho phép thiết bị này truy cập.';
        gateDots.style.display = 'none';
        gateRetryBtn.style.display = 'inline-block';
      } else {
        gateOverlay.classList.add('show');
        gateIcon.textContent = '🔒';
        gateTitle.textContent = 'Đang chờ duyệt truy cập';
        gateSubtitle.textContent = 'Yêu cầu của bạn đã được gửi. Trang sẽ tự mở ra khi được quản trị viên duyệt.';
        gateDots.style.display = 'flex';
        gateRetryBtn.style.display = 'none';
      }
    });
  }

  gateRetryBtn.addEventListener('click', async () => {
    gateRetryBtn.disabled = true;
    gateRetryBtn.textContent = 'Đang gửi...';
    try {
      await myAccessRef.set({
        status: 'pending',
        requestedAt: new Date().toISOString()
      }, { merge: true });
    } catch (e) {
      alert('Không gửi được yêu cầu.');
    }
    gateRetryBtn.disabled = false;
    gateRetryBtn.textContent = 'Gửi yêu cầu lại';
  });

  function updateAdminFab() {
    if (isAdmin) {
      adminFab.classList.add('is-admin');
      adminFab.textContent = '🔑 Quản trị';
    } else {
      adminFab.classList.remove('is-admin');
      adminFab.textContent = '🔑';
    }
  }

  auth.onAuthStateChanged((user) => {
    isAdmin = !!user;
    updateAdminFab();
    if (user) {
      myAccessRef.set({
        status: 'approved',
        isAdmin: true,
        updatedAt: new Date().toISOString()
      }, { merge: true }).catch(() => {});
    }
  });

  function askLogin() {
    return new Promise((resolve) => {
      const authEmailInput = document.getElementById('authEmailInput');
      const pinInput = document.getElementById('pinInput');
      const pinCancelBtn = document.getElementById('pinCancel');
      const pinConfirmBtn = document.getElementById('pinConfirm');
      const pinModal = document.getElementById('pinModal');

      authEmailInput.value = '';
      pinInput.value = '';
      pinModal.classList.add('show');
      setTimeout(() => authEmailInput.focus(), 50);

      function onConfirm() {
        cleanup({ email: authEmailInput.value.trim(), password: pinInput.value });
      }

      function onCancel() {
        cleanup(null);
      }

      function onKey(e) {
        if (e.key === 'Enter') onConfirm();
        if (e.key === 'Escape') onCancel();
      }

      function cleanup(result) {
        pinModal.classList.remove('show');
        pinConfirmBtn.removeEventListener('click', onConfirm);
        pinCancelBtn.removeEventListener('click', onCancel);
        pinInput.removeEventListener('keydown', onKey);
        authEmailInput.removeEventListener('keydown', onKey);
        resolve(result);
      }

      pinConfirmBtn.addEventListener('click', onConfirm);
      pinCancelBtn.addEventListener('click', onCancel);
      pinInput.addEventListener('keydown', onKey);
      authEmailInput.addEventListener('keydown', onKey);
    });
  }

  async function handleAdminLogin() {
    const cred = await askLogin();
    if (cred === null) return;
    if (!cred.email || !cred.password) {
      alert('Vui lòng nhập email và mật khẩu.');
      return;
    }
    try {
      await auth.signInWithEmailAndPassword(cred.email, cred.password);
    } catch (e) {
      alert('Sai email hoặc mật khẩu.');
    }
  }

  adminFab.addEventListener('click', async () => {
    if (!isAdmin) {
      await handleAdminLogin();
      return;
    }
    openAdminPanel();
  });

  closeAdminPanelBtn.addEventListener('click', () => {
    adminPanel.classList.remove('show');
  });

  adminPanel.addEventListener('click', (e) => {
    if (e.target === adminPanel) adminPanel.classList.remove('show');
  });

  function openAdminPanel() {
    adminPanel.classList.add('show');
    if (pendingUnsub) pendingUnsub();
    pendingUnsub = accessCollection.where('status', '==', 'pending').onSnapshot((snap) => {
      const items = snap.docs.filter(d => d.id !== deviceId);
      pendingListEl.innerHTML = '';
      if (items.length === 0) {
        pendingListEl.innerHTML = '<div class="empty-pending">Không có yêu cầu nào đang chờ.</div>';
        return;
      }

      items.forEach((docSnap) => {
        const data = docSnap.data();
        const t = data.requestedAt ? new Date(data.requestedAt) : null;
        const timeStr = t ? (String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0') + ' · ' + String(t.getDate()).padStart(2, '0') + '/' + String(t.getMonth() + 1).padStart(2, '0')) : '';

        const row = document.createElement('div');
        row.className = 'pending-row';
        row.innerHTML = `
          <div class="pending-info">Thiết bị lạ<br><span class="pending-time">Yêu cầu lúc ${timeStr}</span></div>
          <div class="pending-actions">
            <button class="approve-btn">Duyệt</button>
            <button class="deny-btn">Từ chối</button>
          </div>
        `;

        row.querySelector('.approve-btn').addEventListener('click', async () => {
          await accessCollection.doc(docSnap.id).set({ status: 'approved', updatedAt: new Date().toISOString() }, { merge: true });
        });

        row.querySelector('.deny-btn').addEventListener('click', async () => {
          await accessCollection.doc(docSnap.id).set({ status: 'denied', updatedAt: new Date().toISOString() }, { merge: true });
        });

        pendingListEl.appendChild(row);
      });
    });
  }

  const detailPanel = document.createElement('aside');
  detailPanel.className = 'detail-panel';
  detailPanel.id = 'detailPanel';
  detailPanel.innerHTML = `
    <div class="detail-header">
      <div>
        <div class="eyebrow detail-eyebrow">Robot status</div>
        <h2 id="detailRobotName">Robot</h2>
      </div>
      <button class="detail-close" id="closeDetailPanel" type="button">✕</button>
    </div>
    <div class="detail-status-box">
      <span class="status-badge repairing" id="detailStatusBadge">Đang sửa</span>
    </div>
    <div class="detail-block">
      <div class="section-label">Ghi chú</div>
      <div class="detail-notes" id="detailNotesText">Chưa có ghi chú.</div>
    </div>
    <div class="detail-actions">
      <button type="button" class="btn-panel secondary" id="detailEditBtn">Sửa trạng thái & ghi chú</button>
    </div>
    <div class="detail-edit-box" id="detailEditBox">
      <div class="section-label">Cập nhật</div>
      <div class="form-group">
        <label class="form-label">Trạng thái</label>
        <select id="detailStatusSelect" class="form-select">
          <option value="integrating">🔧 Đang tích hợp</option>
          <option value="integrated">✅ Đã tích hợp</option>
          <option value="waiting-software">⌛ Đang đợi cài software</option>
          <option value="waiting-calib">🎛️ Đang đợi calib</option>
          <option value="completed">🎉 Hoàn thành</option>
          <option value="shipped">📦 Đã xuất</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Ghi chú</label>
        <textarea id="detailNotesInput" class="form-textarea" placeholder="Viết ghi chú..."></textarea>
      </div>
      <div class="form-actions compact">
        <button type="button" class="btn-cancel" id="detailCancelEdit">Hủy</button>
        <button type="button" class="btn-submit" id="detailSaveBtn">Lưu</button>
      </div>
    </div>
  `;

  document.body.appendChild(detailPanel);

  const workspace = document.createElement('main');
  workspace.className = 'robot-workspace';
  workspace.innerHTML = `<div class="workspace-top"><button class="workspace-back" id="workspaceBack">← Danh sách robot</button><div class="workspace-heading"><div class="eyebrow">Hồ sơ robot</div><h2 id="workspaceName"></h2><p id="workspaceDescription"></p><span id="workspaceStatus" class="status-badge"></span><div class="form-group" id="workspaceStatusGroup" style="max-width:320px;margin-top:14px"><label class="form-label" for="workspaceStatusSelect">Trạng thái</label><select class="form-select" id="workspaceStatusSelect"><option value="integrating">Đang tích hợp</option><option value="waiting-software">Đang cài phần mềm</option><option value="completed">Hoàn thiện</option></select></div></div></div><div class="workspace-grid"><section class="workspace-section"><h3>Chi tiết cơ khí</h3><p>Cấu trúc, kích thước, bản vẽ và bảo trì.</p><textarea id="mechanicalDetails" class="form-textarea" placeholder="Nhập chi tiết cơ khí..."></textarea></section><section class="workspace-section"><h3>Linh kiện điện tử</h3><p>Bo mạch, cảm biến, động cơ và kết nối.</p><textarea id="electronicDetails" class="form-textarea" placeholder="Nhập linh kiện điện tử..."></textarea></section><section class="workspace-section"><h3>Phần mềm</h3><p>Phiên bản, cấu hình và ghi chú triển khai.</p><textarea id="softwareDetails" class="form-textarea" placeholder="Nhập thông tin phần mềm..."></textarea></section></div><div class="workspace-actions"><button class="workspace-delete" id="workspaceDelete">Xóa robot</button><span id="workspaceMessage"></span><button class="btn-submit" id="workspaceSave">Lưu thông tin</button></div>`;
  document.body.appendChild(workspace);
  let workspaceRobot = null;
  function openRobotWorkspace(robot) {
    workspaceRobot = robot;
    document.getElementById('workspaceName').textContent = robot.name || 'Robot';
    document.getElementById('workspaceDescription').textContent = robot.description || '';
    const currentStatus = normalizeStatus(robot.status);
    const status = ['integrating', 'waiting-software', 'completed'].includes(currentStatus) ? currentStatus : (['shipped', 'done'].includes(currentStatus) ? 'completed' : 'integrating');
    document.getElementById('workspaceStatusSelect').value = status;
    const badge = document.getElementById('workspaceStatus');
    const meta = getStatusMeta(status);
    badge.textContent = status === 'completed' ? 'Hoàn thiện' : (status === 'waiting-software' ? 'Đang cài phần mềm' : 'Đang tích hợp');
    badge.className = 'status-badge ' + meta.key;
    document.getElementById('workspaceStatusGroup').style.display = isAdmin ? '' : 'none';
    document.getElementById('workspaceSave').style.display = isAdmin ? '' : 'none';
    document.getElementById('workspaceDelete').style.display = isAdmin ? '' : 'none';
    const details = robot.technicalDetails || {};
    document.getElementById('mechanicalDetails').value = details.mechanical || '';
    document.getElementById('electronicDetails').value = details.electronics || '';
    document.getElementById('softwareDetails').value = details.software || '';
    ['mechanicalDetails', 'electronicDetails', 'softwareDetails'].forEach(id => { document.getElementById(id).readOnly = !isAdmin; });
    document.getElementById('workspaceMessage').textContent = '';
    document.querySelector('.page').style.display = 'none';
    workspace.classList.add('show'); document.body.classList.add('workspace-open'); window.scrollTo(0, 0);
    history.pushState({ robotId: robot.id }, '', '#robot=' + encodeURIComponent(robot.id));
  }
  function closeRobotWorkspace() { workspace.classList.remove('show'); document.body.classList.remove('workspace-open'); document.querySelector('.page').style.display = ''; workspaceRobot = null; if (location.hash.startsWith('#robot=')) history.pushState({}, '', location.pathname + location.search); }
  document.getElementById('workspaceBack').addEventListener('click', closeRobotWorkspace);
  window.addEventListener('popstate', () => { if (!location.hash.startsWith('#robot=')) closeRobotWorkspace(); });
  document.getElementById('workspaceSave').addEventListener('click', async () => {
    if (!workspaceRobot) return;
    if (!isAdmin) { alert('Thiết bị này chỉ có quyền xem. Hãy đăng nhập bằng tài khoản quản trị để chỉnh sửa robot.'); return; }
    const technicalDetails = { mechanical: document.getElementById('mechanicalDetails').value.trim(), electronics: document.getElementById('electronicDetails').value.trim(), software: document.getElementById('softwareDetails').value.trim() };
    const status = document.getElementById('workspaceStatusSelect').value;
    try { await robotsRef.doc(workspaceRobot.id).update({ technicalDetails, status, updatedAt: new Date().toISOString() }); workspaceRobot.technicalDetails = technicalDetails; workspaceRobot.status = status; const badge = document.getElementById('workspaceStatus'); const meta = getStatusMeta(status); badge.className = 'status-badge ' + meta.key; badge.textContent = status === 'completed' ? 'Hoàn thiện' : (status === 'waiting-software' ? 'Đang cài phần mềm' : 'Đang tích hợp'); document.getElementById('workspaceMessage').textContent = 'Đã lưu.'; }
    catch (error) { console.error('Robot save failed:', error); alert(`Không thể lưu robot (${error.code || 'lỗi'}): ${error.message || 'Hãy kiểm tra quyền truy cập Firestore.'}`); }
  });
  document.getElementById('workspaceDelete').addEventListener('click', async () => {
    if (!workspaceRobot) return;
    if (!isAdmin) { alert('Thiết bị này chỉ có quyền xem. Hãy đăng nhập bằng tài khoản quản trị để xóa robot.'); return; }
    if (!confirm(`Xóa robot "${workspaceRobot.name}"? Dữ liệu sẽ bị xóa vĩnh viễn.`)) return;
    try { await robotsRef.doc(workspaceRobot.id).delete(); closeRobotWorkspace(); }
    catch (error) { console.error('Robot delete failed:', error); alert(`Không thể xóa robot (${error.code || 'lỗi'}): ${error.message || 'Hãy kiểm tra quyền truy cập Firestore.'}`); }
  });

  const detailRobotName = document.getElementById('detailRobotName');
  const detailStatusBadge = document.getElementById('detailStatusBadge');
  const detailNotesText = document.getElementById('detailNotesText');
  const detailEditBox = document.getElementById('detailEditBox');
  const detailStatusSelect = document.getElementById('detailStatusSelect');
  const detailNotesInput = document.getElementById('detailNotesInput');
  const detailEditBtn = document.getElementById('detailEditBtn');
  const detailCancelEdit = document.getElementById('detailCancelEdit');
  const detailSaveBtn = document.getElementById('detailSaveBtn');
  const closeDetailPanel = document.getElementById('closeDetailPanel');

  function openRobotDetail(robot) {
    if (!robot) return;
    openRobotWorkspace(robot);
    return;
    currentEditingRobot = robot;
    const isRepairRobot = robot.type === 'repair';
    buildStatusSelect(detailStatusSelect, isRepairRobot);
    detailRobotName.textContent = robot.name || 'Robot';
    const status = getStatusMeta(robot.status);
    detailStatusBadge.textContent = status.text;
    detailStatusBadge.className = 'status-badge ' + status.key;
    detailNotesText.textContent = robot.notes && robot.notes.trim() ? robot.notes : 'Chưa có ghi chú.';
    detailStatusSelect.value = isRepairRobot ? getRepairStatusValue(robot.status) : normalizeStatus(robot.status);
    detailNotesInput.value = robot.notes || '';
    detailEditBox.classList.remove('show');
    detailPanel.classList.add('show');
  }

  function closeRobotDetail() {
    detailPanel.classList.remove('show');
    currentEditingRobot = null;
  }

  closeDetailPanel.addEventListener('click', closeRobotDetail);
  detailPanel.addEventListener('click', (event) => {
    if (event.target === detailPanel) closeRobotDetail();
  });

  detailEditBtn.addEventListener('click', () => {
    detailEditBox.classList.toggle('show');
  });

  detailCancelEdit.addEventListener('click', () => {
    detailEditBox.classList.remove('show');
    if (currentEditingRobot) {
      const isRepairRobot = currentEditingRobot.type === 'repair';
      buildStatusSelect(detailStatusSelect, isRepairRobot);
      detailStatusSelect.value = isRepairRobot ? getRepairStatusValue(currentEditingRobot.status) : normalizeStatus(currentEditingRobot.status);
      detailNotesInput.value = currentEditingRobot.notes || '';
    }
  });

  detailSaveBtn.addEventListener('click', async () => {
    if (!currentEditingRobot) return;
    const btn = detailSaveBtn;
    btn.disabled = true;
    btn.textContent = 'Đang lưu...';

    try {
      const nextStatus = currentEditingRobot.type === 'repair'
        ? getRepairStatusValue(detailStatusSelect.value)
        : normalizeStatus(detailStatusSelect.value);

      await robotsRef.doc(currentEditingRobot.id).update({
        status: nextStatus,
        notes: detailNotesInput.value.trim(),
        updatedAt: new Date().toISOString()
      });
      detailEditBox.classList.remove('show');
      closeRobotDetail();
    } catch (e) {
      console.error('Detail save error:', e);
      alert('Không thể cập nhật robot.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Lưu';
    }
  });

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function updateSummary() {
    const total = robots.length;
    const active = robots.filter((robot) => {
      const status = normalizeStatus(robot.status);
      return !['completed', 'shipped', 'done'].includes(status);
    }).length;

    document.getElementById('summaryTotal').textContent = total;
    document.getElementById('summaryActive').textContent = active;
  }

  function renderRobots() {
    updateSummary();
    robotsGrid.innerHTML = '';
    if (robots.length === 0) {
      robotsGrid.innerHTML = `
        <div style="grid-column: 1/-1; text-align: center;">
          <div class="empty-state">
            <div class="empty-icon">🤖</div>
            <div class="empty-text">Chưa có robot nào được thêm</div>
            <button class="btn-primary" onclick="document.getElementById('btnAddRobot').click()">Thêm robot đầu tiên</button>
          </div>
        </div>
      `;
      return;
    }

    robots.forEach((robot) => {
      const card = document.createElement('div');
      card.className = 'robot-card';
      card.innerHTML = `
        <button class="robot-row" type="button" data-robot-id="${robot.id}">
          <span class="robot-name-text">${escapeHtml(robot.name)}</span>
        </button>
      `;
      card.querySelector('.robot-row').addEventListener('click', () => openRobotDetail(robot));
      robotsGrid.appendChild(card);
    });
  }

  function listenRobots() {
    robotsRef.orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
      robots = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderRobots();
    });
  }

  function openRobotModal(robot, isRepair = false) {
    repairMode = Boolean(isRepair) || (Boolean(robot) && robot.type === 'repair');
    currentEditingRobot = robot || null;
    buildStatusSelect(robotStatusSelect, repairMode);

    if (robot) {
      modalRobotTitle.textContent = repairMode ? 'Chỉnh sửa robot sửa chữa' : 'Chỉnh sửa robot';
      robotNameInput.value = robot.name || '';
      robotDescInput.value = robot.description || '';
      robotStatusSelect.value = repairMode ? getRepairStatusValue(robot.status) : normalizeStatus(robot.status);
      robotNotesInput.value = robot.notes || '';
    } else {
      modalRobotTitle.textContent = repairMode ? 'Thêm robot sửa chữa' : 'Thêm robot mới';
      robotNameInput.value = '';
      robotDescInput.value = '';
      robotStatusSelect.value = 'repairing';
      robotNotesInput.value = '';
    }
    robotModal.classList.add('show');
    robotNameInput.focus();
  }

  btnAddRobot.addEventListener('click', () => openRobotModal(null, false));

  document.getElementById('closeRobotModal').addEventListener('click', () => {
    robotModal.classList.remove('show');
  });

  document.getElementById('cancelRobotBtn').addEventListener('click', () => {
    robotModal.classList.remove('show');
  });

  document.getElementById('submitRobotBtn').addEventListener('click', async () => {
    const name = robotNameInput.value.trim();
    if (!name) {
      alert('Vui lòng nhập tên robot.');
      return;
    }

    const btn = document.getElementById('submitRobotBtn');
    btn.disabled = true;
    btn.textContent = 'Đang lưu...';

    try {
      const data = {
        name,
        description: robotDescInput.value.trim(),
        status: repairMode ? getRepairStatusValue(robotStatusSelect.value) : normalizeStatus(robotStatusSelect.value),
        notes: robotNotesInput.value.trim(),
        type: repairMode ? 'repair' : 'standard',
        emoji: '🤖',
        updatedAt: new Date().toISOString()
      };

      if (currentEditingRobot) {
        await robotsRef.doc(currentEditingRobot.id).update({
          ...data,
          type: currentEditingRobot.type === 'repair' || repairMode ? 'repair' : 'standard'
        });
      } else {
        data.createdAt = new Date().toISOString();
        await robotsRef.add(data);
      }
      robotModal.classList.remove('show');
    } catch (e) {
      console.error('Save error:', e);
      alert('Không thể lưu dữ liệu: ' + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Lưu robot';
    }
  });

  ensureAccessDoc();
  watchAccess();
  listenRobots();
})();
</script>
</body>
</html>
